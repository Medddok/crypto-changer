<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        .container {
            background-color: #333;
            padding: 30px;
            max-width: 800px;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        h2 {
            text-align: center;
            color: #ffd700;
        }
        .user-info {
            text-align: center;
            margin-top: 20px;
            color: #fff;
        }
        .fact-container {
            margin-top: 30px;
            text-align: center;
            color: #e0e0e0;
            padding: 10px;
            background-color: #444;
            border-radius: 8px;
        }
        button {
            background-color: #5a9f63; /* Темно-зеленый цвет */
            border: none;
            padding: 8px 18px; /* Сделали кнопку компактнее */
            color: white;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px; /* Меньший размер шрифта */
            display: inline-block; /* Выравнивание кнопок по центру */
            margin: 5px; /* Отступы между кнопками */
        }
        button:hover {
            background-color: #4b8c54;
        }
        .back-button {
            background-color: #4CAF50; /* Темнее зеленый */
        }
        .back-button:hover {
            background-color: #45a049;
        }
        .back-button-container {
            margin-top: 20px; /* Отступ сверху для кнопки назад */
            text-align: center; /* Выравнивание кнопки по центру */
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Welcome, {{ username }}!</h2>

        <div class="user-info">
            <p>We're happy to have you here. Check out these interesting crypto facts:</p>
        </div>

        <div class="fact-container">
            <p id="crypto-fact">{{ fact }}</p>
            <button id="new-fact-btn">Show another fact</button>
        </div>

        <!-- Контейнер для кнопки назад -->
        <div class="back-button-container">
            <form action="/main" method="get">
                <button type="submit" class="back-button">Назад</button>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function(){
            // По клику на кнопку, обновляем факт
            $('#new-fact-btn').click(function() {
                $.get('/new_fact', function(data) {
                    // Обновляем отображаемый факт на странице
                    $('#crypto-fact').text(data.new_fact);
                });
            });
        });
    </script>

</body>
</html>
