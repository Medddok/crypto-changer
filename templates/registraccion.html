<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        /* Основные стили */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1e1e1e;  /* Темный фон */
            color: #e0e0e0;  /* Светлый цвет текста */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Контейнер с формой регистрации */
        .container {
            background-color: #333;  /* Темный фон для контейнера */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            width: 280px;
        }

        /* Заголовок */
        h2 {
            color: #ffd700;  /* Яркий желтый цвет */
            text-align: center;
            margin-bottom: 20px;
        }

        /* Метки для формы */
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #e0e0e0;
        }

        /* Поля ввода */
        input[type="text"], input[type="password"] {
            width: 90%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #444;  /* Темная граница */
            border-radius: 5px;
            font-size: 14px;
            background-color: #2a2a2a;  /* Темный фон для полей */
            color: #e0e0e0;  /* Светлый цвет текста */
        }

        /* Кнопка отправки формы */
        button[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #5a9f63;  /* Мягкий зеленый */
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
            border-radius: 5px;
        }

        /* Эффект при наведении на кнопку */
        button[type="submit"]:hover {
            background-color: #45a049;  /* Более темный зеленый */
        }

        /* Сообщения об ошибках или успехах */
        .flash-message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            color: white;
            background-color: #d4675c;  /* Мягкий красный */
            text-align: center;
        }

        /* Ссылки */
        a {
            color: #1da1f2;  /* Синий цвет для ссылок */
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Параграф с текстом под формой */
        p {
            text-align: center;
            margin-top: 15px;
            color: #e0e0e0;  /* Светлый цвет текста */
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Register</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="post" action="/registraccion">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="/login" id="login-link">Login here</a></p>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function(){
            setTimeout(function(){
                $('.flash-message').fadeOut('slow');
            }, 5000);
        });
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
